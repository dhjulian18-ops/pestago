<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="sneakerGray" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="60%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="sShad" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>
  <g filter="url(#sShad)" transform="translate(10, 10)">
    <!-- White Sole -->
    <path d="M 30,105 C 50,110 95,110 125,102 C 132,100 135,95 130,92 C 120,95 90,100 40,98 C 30,98 25,100 30,105 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- Sneaker Upper (Light Slate/Gray) -->
    <path d="M 32,98 C 42,80 58,70 75,68 C 90,66 98,55 108,42 C 114,35 120,38 122,48 C 124,58 128,75 130,92 C 115,96 80,100 32,98 Z" fill="url(#sneakerGray)"/>

    <!-- White Rubber Toe Cap -->
    <path d="M 32,98 C 38,88 48,82 60,80 C 52,90 42,96 32,98 Z" fill="#ffffff"/>

    <!-- White Laces -->
    <line x1="78" y1="68" x2="90" y2="62" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="86" y1="59" x2="98" y2="53" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="94" y1="50" x2="106" y2="44" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>

    <!-- White Eyelets / Collar -->
    <path d="M 108,42 C 114,38 120,40 120,48" stroke="#ffffff" stroke-width="2" fill="none"/>
  </g>
</svg>
