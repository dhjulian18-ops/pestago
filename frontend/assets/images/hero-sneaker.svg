<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="60%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="trackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="shoeBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="orangeStripe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="30%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-10" dy="25" stdDeviation="15" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Cyan Backdrop -->
  <rect width="500" height="450" fill="url(#skyGrad)"/>

  <!-- Athletic stadium running track at bottom right -->
  <path d="M 0,340 C 150,310 320,330 500,280 L 500,450 L 0,450 Z" fill="url(#trackGrad)"/>
  <!-- Track white curved lane lines -->
  <path d="M 0,375 C 160,345 330,365 500,320" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.8"/>
  <path d="M 0,415 C 170,385 340,405 500,360" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.8"/>

  <!-- Motion blur speed lines -->
  <line x1="380" y1="180" x2="480" y2="140" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <line x1="410" y1="210" x2="495" y2="175" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="390" y1="250" x2="475" y2="215" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

  <!-- Sneaker (Tilted / Running action) -->
  <g transform="translate(180, 150) rotate(-22)" filter="url(#shadow)">
    <!-- Sole / Bottom -->
    <path d="M 20,165 C 50,170 120,175 190,160 C 230,150 260,130 270,110 C 275,100 270,90 260,95 C 240,110 200,125 150,130 C 80,135 30,140 15,150 Z" fill="#334155"/>
    <path d="M 22,160 C 50,165 120,170 185,155 C 225,145 255,125 265,108 C 255,115 220,130 170,135 C 100,140 40,145 20,152 Z" fill="#ffffff"/>

    <!-- Sneaker Upper Body -->
    <path d="M 25,150 C 40,110 70,85 100,80 C 130,75 150,60 170,30 C 180,15 195,15 205,25 C 215,40 225,70 235,90 C 250,95 260,105 255,115 C 245,125 190,145 130,150 Z" fill="url(#shoeBody)"/>

    <!-- Dynamic Orange & White Energy Stripes (Heel & Quarter) -->
    <g>
      <path d="M 175,35 L 195,30 L 210,95 L 190,100 Z" fill="url(#orangeStripe)"/>
      <path d="M 190,32 L 208,28 L 225,90 L 207,95 Z" fill="#ffffff"/>
      <path d="M 205,30 L 220,28 L 238,85 L 223,90 Z" fill="url(#orangeStripe)"/>
      <path d="M 218,32 L 230,30 L 248,80 L 236,84 Z" fill="#ffffff"/>
      <path d="M 228,35 L 240,33 L 255,75 L 244,80 Z" fill="url(#orangeStripe)"/>
    </g>

    <!-- Mesh Texture Front / Vamp -->
    <path d="M 35,145 C 50,115 75,95 105,90 C 95,115 80,135 45,145 Z" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="2,3"/>

    <!-- Shoe Tongue & Laces -->
    <path d="M 120,85 C 135,70 150,55 165,40" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
    <!-- Laces cross -->
    <line x1="110" y1="88" x2="135" y2="78" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="125" y1="75" x2="150" y2="65" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="140" y1="62" x2="165" y2="52" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="155" y1="48" x2="175" y2="38" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

    <!-- Collar / Ankle Opening -->
    <path d="M 165,35 C 175,25 190,20 200,28 C 210,38 215,55 210,65 Z" fill="#1e293b"/>
  </g>
</svg>
