<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="phoneBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="screenWall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09132b"/>
      <stop offset="40%" stop-color="#1e3a8a"/>
      <stop offset="70%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <radialGradient id="ringGlow" cx="50%" cy="55%" r="40%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="handGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c69c84"/>
      <stop offset="50%" stop-color="#a67963"/>
      <stop offset="100%" stop-color="#7c533f"/>
    </linearGradient>
  </defs>

  <!-- Ambient glow behind phone -->
  <circle cx="220" cy="300" r="180" fill="url(#bgGlow)" filter="url(#softGlow)"/>

  <!-- Hand fingers holding phone from left & right -->
  <!-- Left thumb -->
  <path d="M 80,310 C 75,280 85,250 105,255 C 120,260 125,285 125,320 C 125,355 105,370 85,355 Z" fill="url(#handGrad)" opacity="0.95"/>
  <!-- Right fingers -->
  <path d="M 320,220 C 340,215 365,225 360,245 C 355,260 335,265 325,260 Z" fill="url(#handGrad)"/>
  <path d="M 322,275 C 345,270 370,280 365,300 C 360,315 338,320 326,315 Z" fill="url(#handGrad)"/>
  <path d="M 322,330 C 345,325 368,335 362,355 C 356,370 335,375 325,370 Z" fill="url(#handGrad)"/>
  <path d="M 320,385 C 340,380 360,390 355,410 C 350,425 330,428 322,422 Z" fill="url(#handGrad)"/>

  <!-- Phone Body Outer Frame -->
  <rect x="115" y="60" width="220" height="460" rx="42" ry="42" fill="#0b0f19" stroke="url(#phoneBorder)" stroke-width="4"/>

  <!-- Phone Screen Inner -->
  <g clip-path="url(#screenClip)">
    <clipPath id="screenClip">
      <rect x="122" y="68" width="206" height="444" rx="36" ry="36"/>
    </clipPath>

    <!-- Wallpaper -->
    <rect x="122" y="68" width="206" height="444" fill="#070c1e"/>

    <!-- Wallpaper organic curves -->
    <circle cx="225" cy="330" r="110" fill="url(#ringGlow)" filter="url(#softGlow)"/>
    <path d="M 120,260 C 160,200 290,200 330,280 C 310,380 150,420 120,260 Z" fill="none" stroke="#60a5fa" stroke-width="14" opacity="0.6" filter="url(#softGlow)"/>
    <path d="M 140,290 C 170,230 280,240 310,310 C 290,390 170,410 140,290 Z" fill="none" stroke="#93c5fd" stroke-width="6" opacity="0.9"/>
    
    <!-- Status / Date -->
    <text x="225" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" fill="#ffffff" opacity="0.85" letter-spacing="0.2">
      Monday, September 9
    </text>

    <!-- Large Clock Time -->
    <text x="225" y="195" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="48" font-weight="800" fill="#ffffff" letter-spacing="-1">
      9:41
    </text>

    <!-- Dynamic Island / Pill notch -->
    <rect x="195" y="78" width="60" height="18" rx="9" ry="9" fill="#000000"/>
    <circle cx="243" cy="87" r="3.5" fill="#1e293b"/>

    <!-- Bottom home bar -->
    <rect x="180" y="500" width="90" height="3.5" rx="2" fill="#ffffff" opacity="0.7"/>
  </g>

  <!-- Specular glare reflection on glass -->
  <path d="M 124,70 L 230,70 L 140,490 L 124,490 Z" fill="#ffffff" opacity="0.04"/>
</svg>
