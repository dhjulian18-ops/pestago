<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="venueGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="pillarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="40%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d81a24"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="goldChandelier" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="venueShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <g filter="url(#venueShadow)">
    <!-- Palace / Ballroom Portico -->
    <!-- Base podium -->
    <rect x="25" y="148" width="150" height="12" rx="4" fill="#64748b"/>
    <rect x="35" y="140" width="130" height="8" rx="2" fill="#94a3b8"/>

    <!-- Pediment Roof (Triangle) -->
    <path d="M 18,78 L 100,32 L 182,78 Z" fill="url(#roofGrad)"/>
    <path d="M 28,76 L 100,38 L 172,76 Z" fill="#ffffff" opacity="0.25"/>

    <!-- Roof Crest Ornament -->
    <circle cx="100" cy="30" r="5" fill="url(#goldChandelier)"/>

    <!-- Architraves beam -->
    <rect x="28" y="78" width="144" height="12" rx="2" fill="url(#wallGrad)" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Pillars (Classic Corinthian Columns) -->
    <rect x="42" y="90" width="14" height="50" rx="3" fill="url(#pillarGrad)"/>
    <rect x="74" y="90" width="14" height="50" rx="3" fill="url(#pillarGrad)"/>
    <rect x="112" y="90" width="14" height="50" rx="3" fill="url(#pillarGrad)"/>
    <rect x="144" y="90" width="14" height="50" rx="3" fill="url(#pillarGrad)"/>

    <!-- Ballroom Center Grand Entrance Arch -->
    <path d="M 88,140 L 88,104 C 88,97 112,97 112,104 L 112,140 Z" fill="#1e293b"/>
    <path d="M 91,140 L 91,106 C 91,101 109,101 109,106 L 109,140 Z" fill="#f8fafc" opacity="0.3"/>

    <!-- Red Carpet Rolling Out -->
    <polygon points="90,140 110,140 124,166 76,166" fill="#d81a24"/>
    <polygon points="93,140 107,140 118,166 82,166" fill="#f43f5e" opacity="0.4"/>

    <!-- Crystal Chandelier inside -->
    <circle cx="100" cy="92" r="3" fill="url(#goldChandelier)"/>
    <path d="M 96,94 L 104,94 L 100,99 Z" fill="url(#goldChandelier)"/>
  </g>
</svg>
