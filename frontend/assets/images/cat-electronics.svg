<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="headBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="headPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <filter id="cShad" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <g filter="url(#cShad)">
    <!-- Blue Headphone -->
    <path d="M 45,95 C 45,55 70,35 95,35" fill="none" stroke="#334155" stroke-width="7" stroke-linecap="round"/>
    <path d="M 45,95 C 45,60 68,40 95,40" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
    <!-- Blue Earcup Left -->
    <rect x="30" y="80" width="22" height="36" rx="11" fill="url(#headBlue)"/>
    <rect x="36" y="84" width="8" height="28" rx="4" fill="#0369a1"/>

    <!-- Pink Headphone (Slightly behind / offset) -->
    <path d="M 115,100 C 115,65 95,45 75,45" fill="none" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
    <!-- Pink Earcup Right -->
    <rect x="105" y="82" width="22" height="36" rx="11" fill="url(#headPink)"/>
    <rect x="112" y="86" width="8" height="28" rx="4" fill="#be185d"/>
  </g>
</svg>
