<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="busGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fff1f2" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gownWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="goldDressAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="sashRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="dressShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <g filter="url(#dressShadow)">
    <!-- Stand Base -->
    <ellipse cx="100" cy="168" rx="28" ry="6" fill="#334155"/>
    <rect x="98" y="140" width="4" height="28" fill="#475569"/>

    <!-- Bridal Gown Skirt -->
    <path d="M 88,96 C 82,120 50,152 48,162 C 55,166 145,166 152,162 C 150,152 118,120 112,96 Z" fill="url(#gownWhite)"/>
    <!-- Lace folds and pleats -->
    <path d="M 88,96 C 84,125 70,148 64,163 C 78,165 92,165 100,163 C 98,135 94,115 92,96 Z" fill="#f1f5f9" opacity="0.6"/>
    <path d="M 112,96 C 116,125 130,148 136,163 C 122,165 108,165 100,163 C 102,135 106,115 108,96 Z" fill="#cbd5e1" opacity="0.35"/>

    <!-- Bodice / Corset -->
    <path d="M 86,58 C 92,54 108,54 114,58 L 112,96 L 88,96 Z" fill="url(#gownWhite)"/>
    <!-- Sweetheart Neckline -->
    <path d="M 86,58 C 93,64 100,60 100,60 C 100,60 107,64 114,58 L 112,70 C 107,66 100,68 100,68 C 100,68 93,66 88,70 Z" fill="url(#goldDressAcc)"/>

    <!-- PestaGo Red Ribbon Sash & Bow at Waist -->
    <rect x="88" y="93" width="24" height="6" rx="2" fill="url(#sashRed)"/>
    <ellipse cx="100" cy="96" rx="5" ry="4" fill="#991b1b"/>
    <path d="M 98,98 L 92,118 L 97,116 L 100,100 Z" fill="url(#sashRed)"/>
    <path d="M 102,98 L 108,118 L 103,116 L 100,100 Z" fill="url(#sashRed)"/>

    <!-- Neck & Mannequin Crown -->
    <rect x="97" y="44" width="6" height="14" fill="#e2e8f0"/>
    <ellipse cx="100" cy="44" rx="8" ry="4" fill="url(#goldDressAcc)"/>

    <!-- Sparkles on dress -->
    <polygon points="120,130 122,134 126,135 122,136 120,140 118,136 114,135 118,134" fill="#fbbf24"/>
    <polygon points="76,140 77,143 80,144 77,145 76,148 75,145 72,144 75,143" fill="#fbbf24"/>
  </g>
</svg>
