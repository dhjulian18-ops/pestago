<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="muaStudioBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="50%" stop-color="#ffe4e6"/>
      <stop offset="100%" stop-color="#fecdd3"/>
    </linearGradient>
    <radialGradient id="muaGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#fef08a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skinTone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffeedb"/>
      <stop offset="50%" stop-color="#f7d6bd"/>
      <stop offset="100%" stop-color="#e8b897"/>
    </linearGradient>
    <linearGradient id="bridalHair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b18"/>
      <stop offset="50%" stop-color="#2a221b"/>
      <stop offset="100%" stop-color="#0f0e0d"/>
    </linearGradient>
    <linearGradient id="goldTiara" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#fbbf24"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="lipGloss" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <filter id="softBeauty" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Studio Backdrop -->
  <rect width="600" height="380" fill="url(#muaStudioBg)"/>
  <circle cx="300" cy="180" r="220" fill="url(#muaGlow)" filter="url(#softBeauty)"/>

  <!-- Bokeh Fairy Lights -->
  <circle cx="80" cy="70" r="16" fill="#ffffff" opacity="0.4"/>
  <circle cx="140" cy="120" r="24" fill="#fef08a" opacity="0.3"/>
  <circle cx="500" cy="80" r="20" fill="#ffffff" opacity="0.35"/>
  <circle cx="540" cy="150" r="30" fill="#fecdd3" opacity="0.5"/>
  <circle cx="70" cy="280" r="28" fill="#fef08a" opacity="0.25"/>
  <circle cx="520" cy="270" r="22" fill="#ffffff" opacity="0.4"/>

  <!-- Bridal Veil Drapery in Background -->
  <path d="M 180,80 C 140,160 120,290 110,380 L 490,380 C 480,290 460,160 420,80 Z" fill="#ffffff" opacity="0.35"/>

  <!-- Floral Hair Crown / Jasmine Garland -->
  <g transform="translate(185, 90)">
    <circle cx="20" cy="20" r="8" fill="#ffffff"/>
    <circle cx="35" cy="14" r="9" fill="#fffbeb"/>
    <circle cx="52" cy="10" r="10" fill="#ffffff"/>
    <circle cx="70" cy="8" r="9" fill="#fef08a"/>
    <circle cx="160" cy="8" r="9" fill="#fef08a"/>
    <circle cx="178" cy="10" r="10" fill="#ffffff"/>
    <circle cx="195" cy="14" r="9" fill="#fffbeb"/>
    <circle cx="210" cy="20" r="8" fill="#ffffff"/>
  </g>

  <!-- Bride Hair Back -->
  <ellipse cx="300" cy="170" rx="90" ry="110" fill="url(#bridalHair)"/>

  <!-- Shoulders & Neck -->
  <path d="M 245,230 C 245,260 210,300 170,330 L 430,330 C 390,300 355,260 355,230 Z" fill="url(#skinTone)"/>
  <!-- Bridal Gown Lace Trim -->
  <path d="M 170,330 C 230,300 370,300 430,330 L 450,380 L 150,380 Z" fill="#ffffff"/>
  <path d="M 230,305 C 270,325 330,325 370,305" fill="none" stroke="url(#goldTiara)" stroke-width="2.5"/>

  <!-- Neck -->
  <rect x="274" y="210" width="52" height="55" rx="10" fill="url(#skinTone)"/>
  <!-- Pearl & Gold Necklace -->
  <path d="M 268,255 C 290,275 310,275 332,255" fill="none" stroke="url(#goldTiara)" stroke-width="3"/>
  <circle cx="300" cy="272" r="5" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>

  <!-- Face Contour -->
  <path d="M 235,130 C 235,85 365,85 365,130 C 365,190 335,225 300,225 C 265,225 235,190 235,130 Z" fill="url(#skinTone)"/>

  <!-- Blush / Soft Cheek Glow -->
  <ellipse cx="258" cy="172" rx="18" ry="10" fill="#f43f5e" opacity="0.32" filter="url(#softBeauty)"/>
  <ellipse cx="342" cy="172" rx="18" ry="10" fill="#f43f5e" opacity="0.32" filter="url(#softBeauty)"/>

  <!-- Elegant Eyebrows -->
  <path d="M 252,142 C 265,136 280,138 288,144" fill="none" stroke="#261b17" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M 348,142 C 335,136 320,138 312,144" fill="none" stroke="#261b17" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Eyes & Long Bridal Lashes -->
  <!-- Left Eye -->
  <path d="M 255,154 C 265,148 280,148 288,154" fill="none" stroke="#18181b" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="272" cy="155" rx="6" ry="6" fill="#18181b"/>
  <circle cx="270" cy="153" r="2" fill="#ffffff"/>
  <!-- Winged Eyeliner -->
  <path d="M 288,154 C 291,152 293,149 295,148" fill="none" stroke="#18181b" stroke-width="2" stroke-linecap="round"/>

  <!-- Right Eye -->
  <path d="M 345,154 C 335,148 320,148 312,154" fill="none" stroke="#18181b" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="328" cy="155" rx="6" ry="6" fill="#18181b"/>
  <circle cx="330" cy="153" r="2" fill="#ffffff"/>
  <!-- Winged Eyeliner -->
  <path d="M 312,154 C 309,152 307,149 305,148" fill="none" stroke="#18181b" stroke-width="2" stroke-linecap="round"/>

  <!-- Nose Definition -->
  <path d="M 298,160 L 298,180 C 298,184 302,185 304,183" fill="none" stroke="#d4a373" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Red Lips with Glow -->
  <path d="M 284,196 C 292,192 298,194 300,195 C 302,194 308,192 316,196 C 316,204 306,211 300,211 C 294,211 284,204 284,196 Z" fill="url(#lipGloss)"/>
  <!-- Lip highlight -->
  <ellipse cx="300" cy="198" rx="4" ry="1.5" fill="#ffffff" opacity="0.6"/>

  <!-- Hair Side Sweeps -->
  <path d="M 235,120 C 245,150 250,170 248,190 C 240,160 236,140 235,120 Z" fill="url(#bridalHair)"/>
  <path d="M 365,120 C 355,150 350,170 352,190 C 360,160 364,140 365,120 Z" fill="url(#bridalHair)"/>

  <!-- Royal Wedding Tiara / Crown -->
  <g transform="translate(230, 70)">
    <path d="M 0,35 C 40,20 100,20 140,35 L 140,25 C 100,12 40,12 0,25 Z" fill="url(#goldTiara)"/>
    <!-- Center Peak -->
    <polygon points="70,0 80,24 60,24" fill="url(#goldTiara)"/>
    <circle cx="70" cy="-2" r="4" fill="#ffffff" stroke="#f59e0b" stroke-width="1"/>
    <!-- Side Peaks -->
    <polygon points="45,8 53,24 37,24" fill="url(#goldTiara)"/>
    <polygon points="95,8 103,24 87,24" fill="url(#goldTiara)"/>
    <polygon points="25,18 31,28 19,28" fill="url(#goldTiara)"/>
    <polygon points="115,18 121,28 109,28" fill="url(#goldTiara)"/>
  </g>

  <!-- Pearl Earrings -->
  <circle cx="236" cy="178" r="5" fill="#ffffff" stroke="#f59e0b" stroke-width="1"/>
  <circle cx="364" cy="178" r="5" fill="#ffffff" stroke="#f59e0b" stroke-width="1"/>

  <!-- Soft Makeup Brushes floating artfully on corner -->
  <g transform="translate(480, 290) rotate(-35)">
    <rect x="0" y="0" width="12" height="70" rx="3" fill="#18181b"/>
    <rect x="0" y="20" width="12" height="15" fill="url(#goldTiara)"/>
    <path d="M 0,0 C 0,-15 12,-15 12,0 Z" fill="#f43f5e"/>
  </g>
</svg>
