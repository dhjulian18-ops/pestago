<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="vaseWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="vShad" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>
  <g filter="url(#vShad)" transform="translate(10, 5)">
    <!-- Flowers & Foliage / Baby's breath -->
    <g transform="translate(70, 48)">
      <!-- Stems -->
      <path d="M 0,25 Q -15,-5 -25,-20" stroke="#16a34a" stroke-width="1.5" fill="none"/>
      <path d="M 0,25 Q 0,-10 0,-28" stroke="#16a34a" stroke-width="1.5" fill="none"/>
      <path d="M 0,25 Q 15,-5 25,-20" stroke="#16a34a" stroke-width="1.5" fill="none"/>

      <!-- Delicate White Flower Clusters -->
      <circle cx="-25" cy="-20" r="7" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.5"/>
      <circle cx="-18" cy="-28" r="6" fill="#f8fafc"/>
      <circle cx="-10" cy="-22" r="7" fill="#ffffff"/>
      
      <circle cx="0" cy="-28" r="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.5"/>
      <circle cx="5" cy="-35" r="6" fill="#f8fafc"/>
      <circle cx="-5" cy="-34" r="6" fill="#ffffff"/>

      <circle cx="25" cy="-20" r="7" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.5"/>
      <circle cx="18" cy="-28" r="6" fill="#f8fafc"/>
      <circle cx="10" cy="-22" r="7" fill="#ffffff"/>

      <circle cx="-2" cy="-15" r="7" fill="#ffffff"/>
      <circle cx="8" cy="-14" r="6" fill="#f8fafc"/>
      <circle cx="-10" cy="-12" r="6" fill="#ffffff"/>
    </g>

    <!-- Ceramic Elegant Vase -->
    <!-- Vase Neck -->
    <path d="M 62,72 L 78,72 L 76,82 L 64,82 Z" fill="url(#vaseWhite)"/>
    <ellipse cx="70" cy="72" rx="8" ry="2.5" fill="#e2e8f0"/>

    <!-- Vase Rounded Belly -->
    <path d="M 64,82 C 45,95 45,125 55,135 C 62,140 78,140 85,135 C 95,125 95,95 76,82 Z" fill="url(#vaseWhite)"/>

    <!-- Specular Highlight on Vase -->
    <path d="M 58,95 C 54,105 55,120 60,128" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
