<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="concertBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f0e1c"/>
    </linearGradient>
    <radialGradient id="micSpotlight" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.4"/>
      <stop offset="40%" stop-color="#ec4899" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vintageChrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="30%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="acousticWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="40%" stop-color="#b45309"/>
      <stop offset="80%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="goldSax" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- Stage Background -->
  <rect width="600" height="380" fill="url(#concertBg)"/>
  <circle cx="300" cy="170" r="230" fill="url(#micSpotlight)"/>

  <!-- Stage Spotlights Beams -->
  <polygon points="120,0 240,250 180,250 60,0" fill="#a855f7" opacity="0.15"/>
  <polygon points="480,0 420,250 360,250 540,0" fill="#ec4899" opacity="0.15"/>
  <polygon points="300,0 350,300 250,300" fill="#fef08a" opacity="0.2"/>

  <!-- Bokeh / Dust particles floating in spotlight -->
  <circle cx="280" cy="90" r="8" fill="#fef08a" opacity="0.6"/>
  <circle cx="330" cy="120" r="12" fill="#ffffff" opacity="0.5"/>
  <circle cx="240" cy="160" r="6" fill="#a855f7" opacity="0.7"/>
  <circle cx="370" cy="180" r="10" fill="#f43f5e" opacity="0.6"/>
  <circle cx="200" cy="80" r="5" fill="#38bdf8" opacity="0.5"/>
  <circle cx="420" cy="110" r="7" fill="#fbbf24" opacity="0.5"/>

  <!-- Musical Notes floating -->
  <g fill="#fef08a" opacity="0.75" transform="rotate(-15 150 110)">
    <!-- Eighth note -->
    <ellipse cx="140" cy="110" rx="10" ry="7"/>
    <rect x="147" y="70" width="3" height="40"/>
    <path d="M 150,70 Q 165,72 165,85" stroke="#fef08a" stroke-width="3" fill="none"/>
  </g>
  <g fill="#f472b6" opacity="0.8" transform="rotate(12 450 100)">
    <!-- Beamed note -->
    <ellipse cx="440" cy="110" rx="9" ry="6"/>
    <ellipse cx="465" cy="105" rx="9" ry="6"/>
    <rect x="446" y="75" width="3" height="35"/>
    <rect x="471" y="70" width="3" height="35"/>
    <polygon points="446,75 474,70 474,75 446,80"/>
  </g>

  <!-- Acoustic Guitar Silhouette & Body (Left) -->
  <g transform="translate(100, 110) rotate(-22)">
    <!-- Neck -->
    <rect x="52" y="10" width="16" height="120" fill="#451a03"/>
    <!-- Headstock with Gold Tuning Pegs -->
    <rect x="48" y="-20" width="24" height="35" rx="4" fill="#78350f"/>
    <circle cx="44" cy="-12" r="3" fill="#fbbf24"/>
    <circle cx="44" cy="-2" r="3" fill="#fbbf24"/>
    <circle cx="76" cy="-12" r="3" fill="#fbbf24"/>
    <circle cx="76" cy="-2" r="3" fill="#fbbf24"/>
    <!-- Guitar Body (Figure 8) -->
    <ellipse cx="60" cy="150" rx="42" ry="34" fill="url(#acousticWood)" stroke="#1e293b" stroke-width="2"/>
    <ellipse cx="60" cy="205" rx="55" ry="48" fill="url(#acousticWood)" stroke="#1e293b" stroke-width="2"/>
    <!-- Soundhole & Rosette -->
    <circle cx="60" cy="165" r="18" fill="#18181b" stroke="#fde68a" stroke-width="3"/>
    <!-- Bridge -->
    <rect x="42" y="215" width="36" height="10" rx="3" fill="#1e293b"/>
    <!-- Strings -->
    <g stroke="#ffffff" stroke-width="1" opacity="0.7">
      <line x1="56" y1="-10" x2="56" y2="220"/>
      <line x1="58" y1="-10" x2="58" y2="220"/>
      <line x1="60" y1="-10" x2="60" y2="220"/>
      <line x1="62" y1="-10" x2="62" y2="220"/>
      <line x1="64" y1="-10" x2="64" y2="220"/>
    </g>
  </g>

  <!-- Saxophone Silhouette (Right) -->
  <g transform="translate(420, 100) rotate(18)">
    <!-- Bell & Tube -->
    <path d="M 30,190 C 20,240 60,250 80,240 C 105,225 105,170 100,140 L 80,140 C 85,170 85,210 70,220 C 58,228 42,215 45,190 L 45,60 C 45,40 55,30 65,30 L 75,30" fill="none" stroke="url(#goldSax)" stroke-width="12" stroke-linecap="round"/>
    <!-- Bell Flare -->
    <ellipse cx="95" cy="140" rx="22" ry="12" fill="url(#goldSax)" stroke="#d97706" stroke-width="2"/>
    <ellipse cx="95" cy="140" rx="16" ry="8" fill="#451a03"/>
    <!-- Keys along body -->
    <circle cx="45" cy="80" r="5" fill="#fde047" stroke="#b45309" stroke-width="1.5"/>
    <circle cx="45" cy="100" r="5" fill="#fde047" stroke="#b45309" stroke-width="1.5"/>
    <circle cx="45" cy="120" r="5" fill="#fde047" stroke="#b45309" stroke-width="1.5"/>
    <circle cx="45" cy="140" r="5" fill="#fde047" stroke="#b45309" stroke-width="1.5"/>
  </g>

  <!-- Vintage Shure 55SH Style Studio Vocal Microphone (Centerpiece) -->
  <g transform="translate(300, 110)">
    <!-- Mic Stand Pole -->
    <line x1="0" y1="120" x2="0" y2="270" stroke="url(#vintageChrome)" stroke-width="8"/>
    <!-- Height adjustment clutch -->
    <rect x="-10" y="190" width="20" height="16" rx="4" fill="#334155"/>

    <!-- Swivel Mount -->
    <rect x="-8" y="105" width="16" height="24" rx="4" fill="#475569"/>
    <circle cx="0" cy="117" r="5" fill="#cbd5e1"/>

    <!-- Retro Mic Outer Shell (Art Deco teardrop capsule) -->
    <path d="M -35,30 C -35,-30 -25,-55 0,-55 C 25,-55 35,-30 35,30 C 35,65 20,85 0,90 C -20,85 -35,65 -35,30 Z" fill="url(#vintageChrome)" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.6))"/>
    <!-- Blue/Purple Silk cloth inside grille -->
    <path d="M -28,25 C -28,-25 -20,-45 0,-45 C 20,-45 28,-25 28,25 C 28,55 15,72 0,76 C -15,72 -28,55 -28,25 Z" fill="#4338ca"/>

    <!-- Horizontal Chrome Grille Ribs -->
    <g stroke="url(#vintageChrome)" stroke-width="3">
      <line x1="-18" y1="-35" x2="18" y2="-35"/>
      <line x1="-24" y1="-22" x2="24" y2="-22"/>
      <line x1="-28" y1="-9" x2="28" y2="-9"/>
      <line x1="-30" y1="4" x2="30" y2="4"/>
      <line x1="-31" y1="17" x2="31" y2="17"/>
      <line x1="-31" y1="30" x2="31" y2="30"/>
      <line x1="-29" y1="43" x2="29" y2="43"/>
      <line x1="-25" y1="56" x2="25" y2="56"/>
      <line x1="-18" y1="68" x2="18" y2="68"/>
    </g>

    <!-- Center Chrome Divider Rib -->
    <rect x="-3" y="-55" width="6" height="142" rx="3" fill="#ffffff"/>

    <!-- Sound Wave Flares emitting from mic -->
    <path d="M -50,-10 C -60,10 -60,40 -50,60" stroke="#f472b6" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M -70,-25 C -85,10 -85,55 -70,80" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M 50,-10 C 60,10 60,40 50,60" stroke="#f472b6" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M 70,-25 C 85,10 85,55 70,80" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>

  <!-- Tag "MC BILINGUAL + FULL ACOUSTIC" -->
  <g transform="translate(30, 315)">
    <rect width="180" height="34" rx="8" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <circle cx="20" cy="17" r="4" fill="#a855f7"/>
    <text x="34" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#f8fafc" letter-spacing="0.5">MC + 5 PERSONEL BAND</text>
  </g>
</svg>
