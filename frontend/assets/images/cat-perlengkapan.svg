<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="perGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#fffbeb" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="speakerBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="wooferCone" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="40%" stop-color="#d81a24"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </radialGradient>
    <linearGradient id="lightBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
    <filter id="speakerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Stage Lighting Beams -->
  <polygon points="50,30 20,165 70,165" fill="url(#lightBeam)" opacity="0.3"/>
  <polygon points="150,30 130,165 180,165" fill="url(#lightBeam)" opacity="0.3"/>

  <g filter="url(#speakerShadow)">
    <!-- Stage Spotlight Fixture -->
    <g transform="translate(130, 28) rotate(-25)">
      <rect x="0" y="0" width="18" height="14" rx="3" fill="#1e293b"/>
      <ellipse cx="9" cy="14" rx="9" ry="4" fill="#fbbf24"/>
      <line x1="9" y1="0" x2="9" y2="-8" stroke="#475569" stroke-width="2"/>
    </g>

    <!-- Main Concert / Event Speaker Cabinet -->
    <rect x="62" y="62" width="76" height="102" rx="10" fill="url(#speakerBox)" stroke="#475569" stroke-width="2"/>
    <!-- Metal corner protectors -->
    <path d="M 62,72 L 72,62 L 62,62 Z" fill="#64748b"/>
    <path d="M 138,72 L 128,62 L 138,62 Z" fill="#64748b"/>
    <path d="M 62,154 L 72,164 L 62,164 Z" fill="#64748b"/>
    <path d="M 138,154 L 128,164 L 138,164 Z" fill="#64748b"/>

    <!-- High Frequency Horn / Tweeter -->
    <rect x="80" y="72" width="40" height="22" rx="4" fill="#0f172a" stroke="#d81a24" stroke-width="1.5"/>
    <polygon points="86,76 114,76 100,88" fill="#f59e0b"/>

    <!-- Big Subwoofer / Bass Driver -->
    <circle cx="100" cy="125" r="26" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <circle cx="100" cy="125" r="22" fill="url(#wooferCone)"/>
    <circle cx="100" cy="125" r="9" fill="#0f172a"/>

    <!-- Sound Wave Pulse Rings -->
    <path d="M 144,115 C 152,120 152,130 144,135" fill="none" stroke="#d81a24" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 152,108 C 164,116 164,134 152,142" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>

    <path d="M 56,115 C 48,120 48,130 56,135" fill="none" stroke="#d81a24" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 48,108 C 36,116 36,134 48,142" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
