<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="cateringBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="50%" stop-color="#292524"/>
      <stop offset="100%" stop-color="#141211"/>
    </linearGradient>
    <radialGradient id="banquetGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="45%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1c1917" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="silverChafing" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="25%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="75%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="goldChafing" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="35%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="tableCover" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="380" fill="url(#cateringBg)"/>
  <circle cx="300" cy="160" r="240" fill="url(#banquetGlow)"/>

  <!-- Bokeh Warm Lights in Background -->
  <circle cx="90" cy="80" r="16" fill="#fef08a" opacity="0.35"/>
  <circle cx="160" cy="120" r="22" fill="#ffffff" opacity="0.25"/>
  <circle cx="510" cy="90" r="26" fill="#fef08a" opacity="0.3"/>
  <circle cx="440" cy="130" r="18" fill="#ffffff" opacity="0.25"/>

  <!-- Grand Banquet Table with Pleated Silk Skirt -->
  <polygon points="40,210 560,210 590,380 10,380" fill="url(#tableCover)" filter="drop-shadow(0 12px 24px rgba(0,0,0,0.6))"/>
  <!-- Gold Runner down the center of table -->
  <polygon points="230,210 370,210 400,380 200,380" fill="#fef08a" opacity="0.45"/>
  <line x1="230" y1="210" x2="200" y2="380" stroke="#f59e0b" stroke-width="2" opacity="0.6"/>
  <line x1="370" y1="210" x2="400" y2="380" stroke="#f59e0b" stroke-width="2" opacity="0.6"/>

  <!-- Elegant Floral Centerpiece Runner on Table -->
  <g transform="translate(140, 200)">
    <ellipse cx="160" cy="6" rx="140" ry="12" fill="#15803d" opacity="0.7"/>
    <!-- Pastel flowers -->
    <circle cx="70" cy="4" r="8" fill="#fda4af"/>
    <circle cx="110" cy="2" r="9" fill="#ffffff"/>
    <circle cx="150" cy="5" r="9" fill="#fef08a"/>
    <circle cx="190" cy="2" r="8" fill="#fda4af"/>
    <circle cx="230" cy="5" r="9" fill="#ffffff"/>
  </g>

  <!-- Polished Luxury Roll-Top Chafing Dish #1 (Left) -->
  <g transform="translate(80, 140)">
    <!-- Stand / Legs -->
    <path d="M 15,65 L 5,95 L 15,95 L 22,65" fill="url(#goldChafing)"/>
    <path d="M 105,65 L 115,95 L 105,95 L 98,65" fill="url(#goldChafing)"/>
    <!-- Burner flame underneath -->
    <polygon points="60,88 56,76 64,76" fill="#38bdf8" opacity="0.8"/>
    <!-- Water / Food Pan Base -->
    <rect x="10" y="55" width="100" height="20" rx="4" fill="url(#silverChafing)"/>
    <!-- Roll-top Dome Lid -->
    <path d="M 12,55 C 12,22 45,15 60,15 C 75,15 108,22 108,55 Z" fill="url(#silverChafing)"/>
    <!-- Gold Handle -->
    <rect x="42" y="10" width="36" height="7" rx="3" fill="url(#goldChafing)"/>
    <!-- Glass View Window with delicious food visible -->
    <ellipse cx="60" cy="40" rx="30" ry="10" fill="#f59e0b" opacity="0.85"/>
    <ellipse cx="60" cy="38" rx="26" ry="7" fill="#ea580c"/>
    <circle cx="50" cy="38" r="3" fill="#16a34a"/>
    <circle cx="70" cy="37" r="3.5" fill="#dc2626"/>
  </g>

  <!-- Grand Polished Golden Chafing Dish #2 (Center Highlight) -->
  <g transform="translate(225, 115)">
    <!-- Golden Stand with curved cabriole legs -->
    <path d="M 20,80 Q 0,115 10,125 L 20,125 Q 15,115 30,80" fill="url(#goldChafing)"/>
    <path d="M 130,80 Q 150,115 140,125 L 130,125 Q 135,115 120,80" fill="url(#goldChafing)"/>
    <!-- Fuel Canister -->
    <rect x="62" y="108" width="26" height="15" rx="3" fill="#64748b"/>
    <ellipse cx="75" cy="104" rx="6" ry="9" fill="#38bdf8" opacity="0.85"/>
    <ellipse cx="75" cy="102" rx="3" ry="5" fill="#fef08a"/>
    <!-- Pan Body -->
    <rect x="15" y="68" width="120" height="24" rx="5" fill="url(#goldChafing)"/>
    <!-- Roll-Top Grand Dome -->
    <path d="M 16,68 C 16,28 55,20 75,20 C 95,20 134,28 134,68 Z" fill="url(#goldChafing)"/>
    <!-- Highlight shine on dome -->
    <path d="M 32,60 C 35,35 60,28 75,28" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <!-- Golden Lion / Crown Handle -->
    <rect x="52" y="14" width="46" height="9" rx="4" fill="#ffffff" opacity="0.9"/>
    <rect x="55" y="16" width="40" height="5" rx="2" fill="url(#goldChafing)"/>
    <!-- Gourmet Main Course Food Steam -->
    <g opacity="0.4" stroke="#ffffff" stroke-width="2">
      <path d="M 60,10 Q 55,0 65,-10"/>
      <path d="M 75,10 Q 85,0 75,-10"/>
      <path d="M 90,10 Q 85,0 95,-10"/>
    </g>
  </g>

  <!-- Polished Luxury Roll-Top Chafing Dish #3 (Right) -->
  <g transform="translate(400, 140)">
    <path d="M 15,65 L 5,95 L 15,95 L 22,65" fill="url(#goldChafing)"/>
    <path d="M 105,65 L 115,95 L 105,95 L 98,65" fill="url(#goldChafing)"/>
    <rect x="10" y="55" width="100" height="20" rx="4" fill="url(#silverChafing)"/>
    <path d="M 12,55 C 12,22 45,15 60,15 C 75,15 108,22 108,55 Z" fill="url(#silverChafing)"/>
    <rect x="42" y="10" width="36" height="7" rx="3" fill="url(#goldChafing)"/>
    <ellipse cx="60" cy="40" rx="30" ry="10" fill="#dc2626" opacity="0.75"/>
    <ellipse cx="60" cy="38" rx="26" ry="7" fill="#b91c1c"/>
  </g>

  <!-- Champagne Flutes Tower / Crystal Glasses on Side -->
  <g transform="translate(490, 230)" opacity="0.9">
    <!-- Flute 1 -->
    <path d="M 20,40 L 25,65 L 25,95 M 15,95 L 35,95" stroke="#ffffff" stroke-width="2" fill="none"/>
    <polygon points="21,42 29,42 27,62 23,62" fill="#fef08a" opacity="0.8"/>
    <!-- Flute 2 -->
    <path d="M 45,35 L 50,60 L 50,95 M 40,95 L 60,95" stroke="#ffffff" stroke-width="2" fill="none"/>
    <polygon points="46,37 54,37 52,58 48,58" fill="#fef08a" opacity="0.8"/>
  </g>

  <!-- Tiered Canape / Dessert Stand on Left Side -->
  <g transform="translate(60, 220)">
    <line x1="40" y1="20" x2="40" y2="90" stroke="url(#goldChafing)" stroke-width="3"/>
    <ellipse cx="40" cy="90" rx="28" ry="8" fill="url(#goldChafing)"/>
    <ellipse cx="40" cy="65" rx="34" ry="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <ellipse cx="40" cy="40" rx="24" ry="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Mini Macarons & Petit Fours -->
    <circle cx="28" cy="63" r="5" fill="#f43f5e"/>
    <circle cx="40" cy="64" r="5" fill="#a855f7"/>
    <circle cx="52" cy="63" r="5" fill="#10b981"/>
    <circle cx="35" cy="39" r="4" fill="#fbbf24"/>
    <circle cx="45" cy="39" r="4" fill="#ec4899"/>
  </g>

  <!-- Quality Badge "MENU NUSANTARA & INTERNATIONAL" -->
  <g transform="translate(30, 315)">
    <rect width="180" height="34" rx="8" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <circle cx="20" cy="17" r="4" fill="#eab308"/>
    <text x="34" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#f8fafc" letter-spacing="0.5">500 PORSI + BONUS GUBUG</text>
  </g>
</svg>
