<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <filter id="gShad" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>
  <g filter="url(#gShad)" transform="translate(10, 10)">
    <!-- Green Cabbage / Broccoli in background -->
    <circle cx="85" cy="85" r="22" fill="#22c55e"/>
    <circle cx="75" cy="78" r="16" fill="#16a34a"/>
    <circle cx="95" cy="80" r="16" fill="#15803d"/>
    <circle cx="85" cy="72" r="15" fill="#4ade80"/>

    <!-- Red Bell Pepper / Tomato (Left) -->
    <g transform="translate(42, 85)">
      <circle cx="16" cy="16" r="16" fill="#ef4444"/>
      <circle cx="10" cy="14" r="12" fill="#dc2626"/>
      <!-- Pepper stem -->
      <path d="M 16,3 C 14,-3 20,-5 22,-3" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/>
      <circle cx="10" cy="8" r="3" fill="#ffffff" opacity="0.3"/>
    </g>

    <!-- Orange Carrots (Bottom Right tilted) -->
    <g transform="translate(85, 95) rotate(-35)">
      <path d="M 0,0 L 40,8 C 45,10 45,14 40,16 L 0,22 Z" fill="#f97316"/>
      <!-- Carrot ridges -->
      <line x1="12" y1="5" x2="16" y2="15" stroke="#ea580c" stroke-width="1.5"/>
      <line x1="24" y1="7" x2="28" y2="15" stroke="#ea580c" stroke-width="1.5"/>
      <!-- Green Carrot Top -->
      <path d="M 0,11 L -15,5 M 0,11 L -18,11 M 0,11 L -15,17" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Purple Eggplant / Aubergine -->
    <path d="M 52,98 C 50,85 62,80 72,92 C 82,105 75,120 62,118 C 52,115 54,105 52,98 Z" fill="#7e22ce"/>
  </g>
</svg>
