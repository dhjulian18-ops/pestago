<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="catGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fffbeb" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="silverPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="goldCloche" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="clocheShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <g filter="url(#clocheShadow)">
    <!-- Serving Platter Rim -->
    <ellipse cx="100" cy="146" rx="72" ry="14" fill="#64748b" opacity="0.4"/>
    <ellipse cx="100" cy="142" rx="74" ry="12" fill="url(#silverPlate)"/>
    <ellipse cx="100" cy="141" rx="66" ry="9" fill="#f8fafc"/>

    <!-- Cloche Food Dome -->
    <path d="M 40,136 C 40,82 160,82 160,136 Z" fill="url(#goldCloche)"/>
    <!-- Dome light reflection -->
    <path d="M 50,134 C 50,96 120,86 142,100 C 122,90 60,98 50,134 Z" fill="#ffffff" opacity="0.6"/>

    <!-- Handle on top -->
    <circle cx="100" cy="72" r="8" fill="url(#goldCloche)"/>
    <circle cx="98" cy="70" r="3" fill="#ffffff" opacity="0.7"/>

    <!-- Decorative Red Ribbon and Bow -->
    <path d="M 39,136 C 70,140 130,140 161,136 L 161,131 C 130,135 70,135 39,131 Z" fill="url(#redAccent)"/>

    <!-- Chef / Banquet Wine Glass beside -->
    <g transform="translate(132, 85)">
      <path d="M 12,0 C 22,0 26,12 26,24 C 26,34 16,38 12,38 C 8,38 -2,34 -2,24 C -2,12 2,0 12,0 Z" fill="#ffffff" opacity="0.85" stroke="#cbd5e1" stroke-width="1"/>
      <path d="M 0,22 C 4,32 20,32 24,22 Z" fill="#d81a24" opacity="0.85"/>
      <rect x="11" y="38" width="2" height="24" fill="#cbd5e1"/>
      <ellipse cx="12" cy="62" rx="10" ry="3" fill="#cbd5e1"/>
    </g>

    <!-- Steam Aromas -->
    <path d="M 85,60 C 80,50 90,42 85,34" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <path d="M 100,56 C 96,48 104,40 100,32" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <path d="M 115,60 C 110,50 120,42 115,34" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>
