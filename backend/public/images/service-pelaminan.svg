<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="pelaminanBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a1b24"/>
      <stop offset="50%" stop-color="#3d2332"/>
      <stop offset="100%" stop-color="#1f141a"/>
    </linearGradient>
    <radialGradient id="stageGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fff1f2" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#fbcfe8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1f141a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldCarving" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="roseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
  </defs>

  <!-- Stage Background -->
  <rect width="600" height="380" fill="url(#pelaminanBg)"/>
  <circle cx="300" cy="180" r="230" fill="url(#stageGlow)"/>

  <!-- Fairy Light Cascades -->
  <g stroke="#fef08a" stroke-width="1" opacity="0.6">
    <line x1="120" y1="20" x2="120" y2="300" stroke-dasharray="2 8"/>
    <line x1="160" y1="20" x2="160" y2="290" stroke-dasharray="2 7"/>
    <line x1="200" y1="20" x2="200" y2="280" stroke-dasharray="2 9"/>
    <line x1="240" y1="20" x2="240" y2="260" stroke-dasharray="2 6"/>
    <line x1="280" y1="20" x2="280" y2="250" stroke-dasharray="2 8"/>
    <line x1="320" y1="20" x2="320" y2="250" stroke-dasharray="2 8"/>
    <line x1="360" y1="20" x2="360" y2="260" stroke-dasharray="2 6"/>
    <line x1="400" y1="20" x2="400" y2="280" stroke-dasharray="2 9"/>
    <line x1="440" y1="20" x2="440" y2="290" stroke-dasharray="2 7"/>
    <line x1="480" y1="20" x2="480" y2="300" stroke-dasharray="2 8"/>
  </g>

  <!-- Luxurious Back Fabric Drapery -->
  <path d="M 100,0 C 130,120 170,220 180,320 L 420,320 C 430,220 470,120 500,0 Z" fill="#ffffff" opacity="0.3"/>
  <path d="M 140,0 C 180,90 220,170 230,260 L 370,260 C 380,170 420,90 460,0 Z" fill="#fff1f2" opacity="0.45"/>

  <!-- Ornate Golden Arch Backdrop -->
  <g transform="translate(300, 160)">
    <!-- Outer Arch Frame -->
    <path d="M -160,140 C -160,-20 -90,-110 0,-110 C 90,-110 160,-20 160,140" fill="none" stroke="url(#goldCarving)" stroke-width="8"/>
    <path d="M -145,140 C -145,-10 -80,-95 0,-95 C 80,-95 145,-10 145,140" fill="none" stroke="#fef08a" stroke-width="2" opacity="0.8"/>
    <!-- Ornate Crown on Top Arch -->
    <path d="M -25,-110 Q 0,-140 25,-110 Q 0,-120 -25,-110 Z" fill="url(#goldCarving)"/>
    <circle cx="0" cy="-135" r="7" fill="#fbbf24"/>
    <circle cx="-25" cy="-125" r="5" fill="#fde047"/>
    <circle cx="25" cy="-125" r="5" fill="#fde047"/>

    <!-- Inner Geometrical Filigree / Gebyok Pattern -->
    <g opacity="0.25" stroke="#fef08a" stroke-width="1.5">
      <circle cx="0" cy="0" r="70" fill="none"/>
      <polygon points="0,-70 70,0 0,70 -70,0" fill="none"/>
      <polygon points="-49,-49 49,-49 49,49 -49,49" fill="none"/>
    </g>
  </g>

  <!-- Luxurious Wedding Stage Platform -->
  <rect x="70" y="290" width="460" height="70" rx="10" fill="#ffffff" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.4))"/>
  <rect x="80" y="295" width="440" height="25" fill="#fdf2f8"/>
  <rect x="70" y="320" width="460" height="8" fill="url(#goldCarving)"/>

  <!-- Golden Throne Chairs (Pelaminan Kursi Pengantin) -->
  <!-- Center Main Double Throne -->
  <g transform="translate(250, 200)">
    <!-- Backrest -->
    <rect x="0" y="10" width="100" height="80" rx="20" fill="#f8fafc" stroke="url(#goldCarving)" stroke-width="4"/>
    <circle cx="50" cy="40" r="14" fill="#fbcfe8" opacity="0.5"/>
    <!-- Tufting buttons -->
    <circle cx="35" cy="35" r="2.5" fill="#d97706"/>
    <circle cx="65" cy="35" r="2.5" fill="#d97706"/>
    <circle cx="50" cy="55" r="2.5" fill="#d97706"/>
    <!-- Seat Cushion -->
    <rect x="-5" y="75" width="110" height="22" rx="6" fill="#ffffff" stroke="url(#goldCarving)" stroke-width="3"/>
    <!-- Golden Legs -->
    <rect x="2" y="96" width="8" height="15" fill="url(#goldCarving)"/>
    <rect x="90" y="96" width="8" height="15" fill="url(#goldCarving)"/>
  </g>

  <!-- Left Parent Chair -->
  <g transform="translate(160, 220)">
    <rect x="0" y="10" width="55" height="65" rx="14" fill="#f8fafc" stroke="url(#goldCarving)" stroke-width="3"/>
    <rect x="-4" y="62" width="63" height="18" rx="5" fill="#ffffff" stroke="url(#goldCarving)" stroke-width="2.5"/>
    <rect x="2" y="78" width="6" height="15" fill="url(#goldCarving)"/>
    <rect x="47" y="78" width="6" height="15" fill="url(#goldCarving)"/>
  </g>

  <!-- Right Parent Chair -->
  <g transform="translate(385, 220)">
    <rect x="0" y="10" width="55" height="65" rx="14" fill="#f8fafc" stroke="url(#goldCarving)" stroke-width="3"/>
    <rect x="-4" y="62" width="63" height="18" rx="5" fill="#ffffff" stroke="url(#goldCarving)" stroke-width="2.5"/>
    <rect x="2" y="78" width="6" height="15" fill="url(#goldCarving)"/>
    <rect x="47" y="78" width="6" height="15" fill="url(#goldCarving)"/>
  </g>

  <!-- Lush Floral Arrangements & Garlands (Bunga Segar) -->
  <!-- Top Arch Garland -->
  <g transform="translate(130, 45)">
    <!-- Rose blooms and eucalyptus foliage -->
    <ellipse cx="60" cy="20" rx="35" ry="16" fill="#84cc16" opacity="0.8"/>
    <ellipse cx="170" cy="10" rx="40" ry="18" fill="#65a30d" opacity="0.8"/>
    <ellipse cx="280" cy="20" rx="35" ry="16" fill="#84cc16" opacity="0.8"/>

    <!-- Roses -->
    <circle cx="40" cy="18" r="14" fill="url(#roseGradient)"/>
    <circle cx="65" cy="24" r="12" fill="#fbcfe8"/>
    <circle cx="85" cy="16" r="15" fill="#ffffff"/>
    <circle cx="110" cy="22" r="13" fill="url(#roseGradient)"/>
    <circle cx="140" cy="12" r="16" fill="#fff1f2"/>
    <circle cx="170" cy="18" r="18" fill="url(#roseGradient)"/>
    <circle cx="200" cy="14" r="15" fill="#ffffff"/>
    <circle cx="230" cy="22" r="13" fill="#fbcfe8"/>
    <circle cx="255" cy="16" r="15" fill="url(#roseGradient)"/>
    <circle cx="280" cy="24" r="12" fill="#fff1f2"/>
    <circle cx="300" cy="18" r="14" fill="url(#roseGradient)"/>
  </g>

  <!-- Standing Floral Vases in Front -->
  <!-- Left Vase -->
  <g transform="translate(85, 230)">
    <path d="M 15,40 L 25,70 L 5,70 Z" fill="url(#goldCarving)"/>
    <ellipse cx="15" cy="30" rx="30" ry="18" fill="#4d7c0f"/>
    <circle cx="8" cy="25" r="12" fill="url(#roseGradient)"/>
    <circle cx="22" cy="20" r="14" fill="#ffffff"/>
    <circle cx="14" cy="35" r="11" fill="#fbcfe8"/>
  </g>
  <!-- Right Vase -->
  <g transform="translate(485, 230)">
    <path d="M 15,40 L 25,70 L 5,70 Z" fill="url(#goldCarving)"/>
    <ellipse cx="15" cy="30" rx="30" ry="18" fill="#4d7c0f"/>
    <circle cx="8" cy="25" r="12" fill="#ffffff"/>
    <circle cx="22" cy="20" r="14" fill="url(#roseGradient)"/>
    <circle cx="14" cy="35" r="11" fill="#fbcfe8"/>
  </g>

  <!-- Badge "EXCLUSIVE FLORAL & LIGHTING" -->
  <g transform="translate(30, 315)">
    <rect width="180" height="34" rx="8" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <circle cx="20" cy="17" r="4" fill="#f43f5e"/>
    <text x="34" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#f8fafc" letter-spacing="0.5">FULL BUNGA SEGAR</text>
  </g>
</svg>
