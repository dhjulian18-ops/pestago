<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="hibGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fff1f2" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="guitarWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <linearGradient id="micMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="pestaRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#d81a24"/>
    </linearGradient>
    <filter id="musicShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <g filter="url(#musicShadow)">
    <!-- Acoustic Guitar Body (Tilted) -->
    <g transform="translate(15, 0) rotate(18 100 100)">
      <!-- Body -->
      <path d="M 68,145 C 50,140 40,115 54,95 C 64,80 62,75 58,68 C 54,58 60,48 74,48 C 88,48 94,58 90,68 C 86,75 84,80 94,95 C 108,115 98,140 80,145 Z" fill="url(#guitarWood)"/>
      <!-- Inner pickguard (PestaGo Red) -->
      <path d="M 76,80 C 84,80 88,88 84,95 C 80,102 72,100 70,95 Z" fill="url(#pestaRed)"/>
      <!-- Sound hole -->
      <circle cx="74" cy="90" r="10" fill="#1e293b"/>
      <circle cx="74" cy="90" r="12" fill="none" stroke="#fbbf24" stroke-width="1"/>

      <!-- Bridge -->
      <rect x="68" y="118" width="12" height="4" rx="1" fill="#451a03"/>

      <!-- Fretboard / Neck -->
      <rect x="71" y="15" width="6" height="35" fill="#451a03"/>
      <!-- Headstock -->
      <rect x="69" y="4" width="10" height="14" rx="2" fill="url(#guitarWood)"/>
      <circle cx="67" cy="8" r="1.5" fill="#f59e0b"/>
      <circle cx="67" cy="13" r="1.5" fill="#f59e0b"/>
      <circle cx="81" cy="8" r="1.5" fill="#f59e0b"/>
      <circle cx="81" cy="13" r="1.5" fill="#f59e0b"/>

      <!-- Strings -->
      <line x1="72" y1="12" x2="72" y2="120" stroke="#f8fafc" stroke-width="0.8" opacity="0.8"/>
      <line x1="74" y1="12" x2="74" y2="120" stroke="#f8fafc" stroke-width="0.8" opacity="0.8"/>
      <line x1="76" y1="12" x2="76" y2="120" stroke="#f8fafc" stroke-width="0.8" opacity="0.8"/>
    </g>

    <!-- Stage Vintage Microphone in Front -->
    <g transform="translate(112, 75)">
      <!-- Stand pole -->
      <rect x="14" y="40" width="4" height="48" fill="#475569"/>
      <!-- Stand clutch -->
      <rect x="12" y="55" width="8" height="6" rx="1" fill="#f59e0b"/>

      <!-- Mic capsule handle -->
      <path d="M 11,26 L 21,26 L 19,42 L 13,42 Z" fill="#1e293b"/>
      <circle cx="16" cy="16" r="13" fill="url(#micMetal)"/>
      <!-- Grille pattern -->
      <line x1="7" y1="16" x2="25" y2="16" stroke="#475569" stroke-width="1.5"/>
      <line x1="16" y1="5" x2="16" y2="27" stroke="#475569" stroke-width="1.5"/>
      <circle cx="16" cy="16" r="13" fill="none" stroke="#d81a24" stroke-width="1.5"/>
    </g>

    <!-- Musical Notes floating with party vibes -->
    <!-- 8th Note -->
    <g transform="translate(36, 45)">
      <ellipse cx="6" cy="16" rx="4" ry="3" transform="rotate(-20 6 16)" fill="#d81a24"/>
      <rect x="8" y="4" width="2" height="13" fill="#d81a24"/>
      <path d="M 10,4 C 15,6 16,10 16,12" fill="none" stroke="#d81a24" stroke-width="2" stroke-linecap="round"/>
    </g>
    <!-- Beamed Double Note -->
    <g transform="translate(136, 35)">
      <ellipse cx="5" cy="16" rx="3.5" ry="2.5" fill="#f59e0b"/>
      <ellipse cx="17" cy="13" rx="3.5" ry="2.5" fill="#f59e0b"/>
      <rect x="7" y="4" width="1.5" height="12" fill="#f59e0b"/>
      <rect x="19" y="1" width="1.5" height="12" fill="#f59e0b"/>
      <polygon points="7,4 20,1 20,4 7,7" fill="#f59e0b"/>
    </g>
  </g>
</svg>
