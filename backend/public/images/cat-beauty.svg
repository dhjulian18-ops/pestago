<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="cosBottle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="pumpBottle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="creamJar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </linearGradient>
    <filter id="mShad" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>
  <g filter="url(#mShad)" transform="translate(15, 10)">
    <!-- Tall Serum / Lotion Bottle (Center-Right) -->
    <rect x="70" y="55" width="28" height="65" rx="6" fill="#fef9c3" stroke="#fef08a" stroke-width="1"/>
    <!-- Bottle Cap & Pump -->
    <rect x="78" y="45" width="12" height="10" fill="#e2e8f0"/>
    <path d="M 84,45 L 84,38 L 74,38" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <!-- Bottle Liquid Level -->
    <rect x="72" y="70" width="24" height="48" rx="4" fill="url(#cosBottle)" opacity="0.6"/>

    <!-- Small Dropper Bottle (Left) -->
    <rect x="42" y="75" width="20" height="45" rx="5" fill="#f43f5e" opacity="0.8"/>
    <rect x="47" y="68" width="10" height="7" fill="#0f172a"/>
    <path d="M 52,68 C 50,60 54,60 52,58" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>

    <!-- Round Cream Jar in Front -->
    <ellipse cx="68" cy="118" rx="26" ry="14" fill="url(#creamJar)" stroke="#f472b6" stroke-width="0.8"/>
    <ellipse cx="68" cy="112" rx="26" ry="8" fill="#fce7f3"/>
    <ellipse cx="68" cy="110" rx="22" ry="6" fill="#ffffff"/>
  </g>
</svg>
