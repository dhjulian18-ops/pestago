<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="dokGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fff7ed" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="camBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="lensGlass" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#0284c7"/>
      <stop offset="80%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>
    <linearGradient id="redRing" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#d81a24"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="camShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <g filter="url(#camShadow)">
    <!-- Tripod Mount Plate -->
    <rect x="75" y="152" width="50" height="6" rx="2" fill="#475569"/>

    <!-- Camera Body -->
    <rect x="36" y="66" width="128" height="86" rx="14" fill="url(#camBody)"/>
    <!-- Textured Leather Grip -->
    <rect x="36" y="74" width="28" height="74" rx="4" fill="#0f172a"/>
    <line x1="42" y1="78" x2="42" y2="144" stroke="#334155" stroke-width="1.5" stroke-dasharray="2 3"/>
    <line x1="48" y1="78" x2="48" y2="144" stroke="#334155" stroke-width="1.5" stroke-dasharray="2 3"/>

    <!-- Viewfinder Pentaprism Hump -->
    <path d="M 76,66 L 86,48 L 114,48 L 124,66 Z" fill="url(#camBody)"/>
    <rect x="90" y="44" width="20" height="4" rx="1.5" fill="url(#goldAcc)"/>

    <!-- Shutter Button & Dial -->
    <ellipse cx="50" cy="64" rx="7" ry="3" fill="#cbd5e1"/>
    <ellipse cx="140" cy="64" rx="8" ry="4" fill="url(#goldAcc)"/>

    <!-- Lens Barrel Outer -->
    <circle cx="106" cy="110" r="40" fill="#1e293b" stroke="#475569" stroke-width="3"/>
    <!-- PestaGo Red Luxury 'L' Series Ring -->
    <circle cx="106" cy="110" r="35" fill="none" stroke="url(#redRing)" stroke-width="2.5"/>
    <circle cx="106" cy="110" r="32" fill="#090d16"/>

    <!-- Glass Element / Optical Coating Reflection -->
    <circle cx="106" cy="110" r="28" fill="url(#lensGlass)"/>
    <ellipse cx="98" cy="102" rx="12" ry="7" transform="rotate(-30 98 102)" fill="#ffffff" opacity="0.45"/>
    <ellipse cx="114" cy="118" rx="8" ry="4" transform="rotate(-30 114 118)" fill="#38bdf8" opacity="0.6"/>

    <!-- Flash Light Pulse -->
    <circle cx="145" cy="80" r="5" fill="#fef08a"/>
    <polygon points="145,72 147,77 152,78 147,81 145,86 143,81 138,78 143,77" fill="#fbbf24"/>
  </g>
</svg>
